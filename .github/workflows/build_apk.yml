name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Rebuild Clean Android Environment
        run: |
          # 1. Backup google-services.json
          mkdir -p /tmp/backup
          find . -name "google-services.json" -exec cp {} /tmp/backup/ \;

          # 2. Fresh Android Setup
          rm -rf android
          flutter create --org com.auramusic --project-name aura_music /tmp/fresh_app
          mv /tmp/fresh_app/android ./android
          rm -rf /tmp/fresh_app

          # 3. Restore google-services.json
          if [ -f "/tmp/backup/google-services.json" ]; then
            cp /tmp/backup/google-services.json android/app/
          fi

          # 4. Inject Google Services & AdMob into fresh files
          sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle
          sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
