name: aura_music
description: "All-in-one modern cloud music player with AdMob & Firestore."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_video_progress_bar: ^2.0.3
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  google_mobile_ads: ^5.2.0

flutter:
  uses-material-design: true
  
